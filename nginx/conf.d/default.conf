# ================================
# Configuration Nginx pour My Pro Partner
# Domains: mypropartner.fr (prod) + staging.mypropartner.fr (preprod)
# ================================

# ================================
# STAGING - staging.mypropartner.fr
# ================================

upstream nextjs_staging {
    server app-staging:3000;
    keepalive 32;
}

# HTTP redirect for staging
server {
    listen 80;
    listen [::]:80;
    server_name staging.mypropartner.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS for staging
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.mypropartner.fr;

    ssl_certificate /etc/nginx/ssl/staging/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/staging/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Block search engine indexing for staging
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 50M;

    access_log /var/log/nginx/staging-access.log;
    error_log /var/log/nginx/staging-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://nextjs_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://nextjs_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /_next/static/ {
        proxy_pass http://nextjs_staging;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    location /_next/image {
        proxy_pass http://nextjs_staging;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /health {
        access_log off;
        proxy_pass http://nextjs_staging;
    }

    location = /favicon.ico {
        proxy_pass http://nextjs_staging;
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /robots.txt {
        proxy_pass http://nextjs_staging;
        access_log off;
        log_not_found off;
    }
}

