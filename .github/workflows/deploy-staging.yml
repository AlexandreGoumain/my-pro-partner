name: Deploy to Staging

on:
  push:
    branches: [preprod]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Run tests
        run: npm run test:run

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 51.91.111.112
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/apps/my-pro-partner

            echo "=== Pulling latest changes ==="
            git fetch origin
            git checkout preprod
            git pull origin preprod

            echo "=== Building staging container ==="
            docker-compose -f docker-compose.staging.yml build --no-cache

            echo "=== Starting staging container ==="
            docker-compose -f docker-compose.staging.yml up -d

            echo "=== Running database migrations ==="
            docker-compose -f docker-compose.staging.yml exec -T app-staging npx prisma migrate deploy

            echo "=== Staging deployment complete ==="
            echo "URL: https://staging.mypropartner.fr"
